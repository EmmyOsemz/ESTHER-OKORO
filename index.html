            margin: 0;

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(12, 12, 12, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.22);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.9), 0 0 25px rgba(217, 119, 6, 0.08);
        }

        .glass-nav {
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Transparent Glass Sheen Button Hover Effect */
        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(251, 191, 36, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(217, 119, 6, 0.25);
        }

        /* Mouse Cursor Following Radial Glow Effect */
        #cursor-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(217, 119, 6, 0.12) 0%, rgba(0, 112, 243, 0.08) 35%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            transition: transform 0.04s ease-out;
        }

        /* Typewriter Cursor Caret Effect */
        .typewriter-cursor::after {
            content: '|';
            animation: blink 0.8s infinite;
            color: #fbbf24;
            font-weight: 300;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Scroll Reveal Animation Classes */
        .reveal-on-scroll {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal-on-scroll.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        /* Ambient Glow Pulse */
        @keyframes ambientPulse {
            0%, 100% { opacity: 0.35; transform: scale(1); }
            50% { opacity: 0.65; transform: scale(1.1); }
        }

        .ambient-blob {

                <i data-lucide="download" class="w-4 h-4"></i> Download Full Resume (PDF)
            </button>
        </div>
    </div>

    <!-- INTERACTION LOGIC -->
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // 1. TYPEWRITER EFFECT FOR HERO HEADLINE
        const textToType = "Building High-Performing Teams & Thriving Workcultures.";
        const targetElement = document.getElementById('typewriter-text');
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < textToType.length) {
                targetElement.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 45);
            }
        }

        window.addEventListener('load', () => {
            setTimeout(typeWriter, 300);
        });

        // 2. MOUSE CURSOR RADIAL SPOTLIGHT
        const cursorGlow = document.getElementById('cursor-glow');
        window.addEventListener('mousemove', (e) => {
            cursorGlow.style.left = `${e.clientX}px`;
            cursorGlow.style.top = `${e.clientY}px`;
        });

        // 3. REAL-TIME DEVICE VIEWPORT SWITCHER
        function setViewport(mode) {
            const wrapper = document.getElementById('frame-viewport-wrapper');
            const buttons = document.querySelectorAll('.vp-btn');
            
            buttons.forEach(btn => {
                btn.classList.remove('active', 'bg-neutral-800', 'text-white');
                btn.classList.add('text-neutral-400');
            });

            const activeBtn = document.getElementById(`btn-vp-${mode}`);
            if (activeBtn) {
                activeBtn.classList.add('active', 'bg-neutral-800', 'text-white');
            }

            if (mode === 'desktop') {
                wrapper.style.width = '100%';
            } else if (mode === 'laptop') {
                wrapper.style.width = '1024px';
            } else if (mode === 'tablet') {
                wrapper.style.width = '768px';
            } else if (mode === 'mobile') {
                wrapper.style.width = '390px';
            }
        }

        // 4. SCROLL-DRIVEN CAREER TIMELINE PROGRESS LINE
        window.addEventListener('scroll', () => {
            const container = document.getElementById('timeline-container');
            const progressLine = document.getElementById('timeline-progress-line');
            if (container && progressLine) {
                const rect = container.getBoundingClientRect();
                const windowHeight = window.innerHeight;
                const totalHeight = rect.height;
                const visibleY = Math.max(0, windowHeight / 2 - rect.top);
                const progressPercent = Math.min(100, Math.max(0, (visibleY / totalHeight) * 100));
                progressLine.style.height = `${progressPercent}%`;
            }
        });

        // 5. SCROLL REVEAL OBSERVER
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('revealed');
                }
            });
        }, { threshold: 0.12 });

        document.querySelectorAll('.reveal-on-scroll').forEach(el => revealObserver.observe(el));

        // 6. TECH STACK FILTERING & SEARCH
        function setTechCat(cat) {
            const tabs = document.querySelectorAll('#techCategoryTabs button');
            tabs.forEach(tab => {
                if(tab.getAttribute('data-cat') === cat) {
                    tab.className = 'tech-tab active px-3.5 py-1.5 rounded-lg bg-amber-500 text-black font-bold transition-all';
                } else {
                    tab.className = 'tech-tab px-3.5 py-1.5 rounded-lg bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-white transition-all';
                }
            });

            const cards = document.querySelectorAll('.tech-card');
            cards.forEach(card => {
                if(cat === 'all' || card.classList.contains(cat)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function filterTech() {
            const q = document.getElementById('techSearch').value.toLowerCase();
            const cards = document.querySelectorAll('.tech-card');
            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(q) ? 'block' : 'none';
            });
        }

        // 7. ACCORDION TOGGLE
        function toggleAccordion(roleId) {
            const content = document.getElementById(roleId + '-content');
            const icon = document.getElementById(roleId + '-icon');
            if(content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                content.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        // 8. MODAL HANDLERS
        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            document.getElementById(id).classList.add('flex');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
        }

        function handleBooking(e) {
            e.preventDefault();
            alert('Consultation booking submitted! Esther Okoro\'s team will confirm shortly.');
            closeModal('bookingModal');
            e.target.reset();
        }

        function handleOptin(e) {
            e.preventDefault();
            document.getElementById('optinSuccess').classList.remove('hidden');
            document.getElementById('optinSuccess').classList.add('flex');
            document.getElementById('optinEmail').value = '';
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
        }
    </script>
</body>
</html>
